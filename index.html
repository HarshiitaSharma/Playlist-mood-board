<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playlist Mood Board</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Playlist mood board</h1>
  <p class="sub">Paste your song titles, one per line, or import a playlist from Spotify. They get sorted into vibes you can rearrange, then saved as an image or a link.</p>

  <section class="input">
    <label for="songs" class="sr">Song titles</label>
    <textarea id="songs" placeholder="Blinding Lights&#10;Someone Like You&#10;Walking on Sunshine&#10;The Weeknd - Midnight&#10;Sunday Morning"></textarea>
    <div class="row">
      <button class="primary" id="sort">Sort into vibes</button>
      <button id="sample">Try a sample</button>
      <button id="sp-connect">Import from Spotify</button>
      <span class="hint">Use "Artist - Title" or just the title.</span>
    </div>
    <div class="row" id="sp-picker" hidden>
      <select id="sp-list" aria-label="Your Spotify playlists"></select>
      <button id="sp-load" class="primary">Load playlist</button>
      <button id="sp-logout">Disconnect</button>
    </div>
  </section>

  <section id="board" hidden>
    <div class="titlebar">
      <input id="title" value="My mood board" aria-label="Board title" maxlength="60">
      <div class="row" style="margin:0">
        <button id="png" class="primary">Download PNG</button>
        <button id="link">Copy share link</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="app.js"></script>
<script src="spotify.js"></script>
</body>
</html>

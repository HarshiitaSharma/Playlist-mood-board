<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playlist Mood Board</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F3F8;--ink:#1A1B33;--muted:#5B5E7A;--line:#D3D6E4;--panel:#fff;--accent:#3B3FD9}
@media (prefers-color-scheme:dark){:root{--bg:#14152A;--ink:#EEF0FF;--muted:#9DA1C4;--line:#2E3052;--panel:#1D1F3A;--accent:#8D90FF}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;padding:max(24px,env(safe-area-inset-top)) 20px 64px}
main{max-width:1100px;margin:0 auto}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 28px;max-width:56ch}
.input{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
textarea{width:100%;min-height:150px;resize:vertical;border:0;background:transparent;color:var(--ink);font:inherit;outline:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
button{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 16px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:hover{filter:brightness(1.08)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:.85rem;margin-left:auto}
#board{margin-top:36px}
#board[hidden]{display:none}
.titlebar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px}
#title{font:inherit;font-size:1.6rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);background:transparent;border:0;border-bottom:2px dashed var(--line);padding:2px 0;min-width:0;flex:1 1 260px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;align-items:start}
.tile{border-radius:18px;padding:20px 18px 14px}
.tile h2{margin:0 0 2px;font-size:2rem;font-weight:800;letter-spacing:-.035em;line-height:1}
.tile .n{font-size:.85rem;opacity:.75;margin:0 0 12px}
.tile ul{list-style:none;margin:0;padding:0}
.tile li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid currentColor;border-top-color:color-mix(in srgb,currentColor 25%,transparent)}
.tile li span{flex:1;min-width:0;overflow-wrap:anywhere}
.tile select{max-width:74px;font:inherit;font-size:.75rem;color:inherit;background:transparent;border:1px solid color-mix(in srgb,currentColor 35%,transparent);border-radius:6px;padding:2px 4px;cursor:pointer;opacity:.8}
.tile select option{color:#1A1B33}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Playlist mood board</h1>
  <p class="sub">Paste your song titles, one per line. They get sorted into vibes you can rearrange, then saved as an image or a link.</p>

  <section class="input">
    <label for="songs" class="sr" style="position:absolute;left:-9999px">Song titles</label>
    <textarea id="songs" placeholder="Blinding Lights&#10;Someone Like You&#10;Walking on Sunshine&#10;The Weeknd - Midnight&#10;Sunday Morning"></textarea>
    <div class="row">
      <button class="primary" id="sort">Sort into vibes</button>
      <button id="sample">Try a sample</button>
      <span class="hint">Works offline. Use "Artist - Title" or just the title.</span>
    </div>
  </section>

  <section id="board" hidden>
    <div class="titlebar">
      <input id="title" value="My mood board" aria-label="Board title" maxlength="60">
      <div class="row" style="margin:0">
        <button id="png" class="primary">Download PNG</button>
        <button id="link">Copy share link</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- Vibes: id, name, colors, keyword stems (matched at word start) ---------- */
const VIBES = [
  {id:'night', name:'After midnight', bg:'#23224F', fg:'#E6E4FF',
   k:['night','midnight','moon','dark','shadow','neon','city','drive','sleep','3am','2am','late','star','blinding','light','dream','insomnia','after hours']},
  {id:'heart', name:'Heartache', bg:'#8E1F45', fg:'#FFE3EA',
   k:['love','heart','break','broke','cry','tear','miss','goodbye','lonely','alone','sorry','hurt','without','someone like','rain','lost','gone','ex','pain','sad','blue','fade','leave','left']},
  {id:'dance', name:'Dance floor', bg:'#FF4F9A', fg:'#2A0716',
   k:['dance','party','club','fire','tonight','move','groove','bounce','disco','shake','jump','funk','boogie','levitat','dynamite','body','rhythm','beat','electric','wild','swing','hype']},
  {id:'sun', name:'Golden hour', bg:'#FFC93C', fg:'#3A2A00',
   k:['sun','summer','happy','good','beach','smile','golden','sweet','paradise','island','lemon','bright','joy','sunny','morning','holiday','vacation','sugar','honey','shine','dancing queen','feel']},
  {id:'chill', name:'Slow drift', bg:'#7FD6C2', fg:'#0C3B33',
   k:['chill','easy','slow','calm','soft','gentle','lazy','sunday','coffee','breathe','float','ocean','water','cloud','sky','quiet','tea','lullaby','peace','still','wave','river','mellow','sleepy','garden']},
  {id:'heavy', name:'Full volume', bg:'#C23A1E', fg:'#FFF1EC',
   k:['rage','kill','war','fight','hell','blood','burn','scream','thunder','riot','metal','power','monster','devil','bad','angry','crush','storm','war','destroy','smash','revolution','run','loud','war']},
  {id:'rewind', name:'Rewind', bg:'#B9A3F0', fg:'#1E1250',
   k:['yesterday','memor','remember','old','young','childhood','forever','90s','80s','70s','back','again','days','once','years','time','nostalg','home','wonder','vintage','retro','sixteen','teen']},
  {id:'none', name:'Unsorted', bg:'#D5D8E4', fg:'#2A2D45', k:[]}
];
const byId = Object.fromEntries(VIBES.map(v=>[v.id,v]));

/* Swap this function out for an LLM or Spotify-audio-features call if you want smarter grouping. */
function classify(title){
  const words = title.toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);
  const text = ' ' + words.join(' ');
  let best = 'none', top = 0;
  for(const v of VIBES){
    let score = 0;
    for(const k of v.k){
      const hit = k.includes(' ') ? text.includes(' '+k) : words.some(w=>w===k || (k.length>3 && w.startsWith(k)));
      if(hit) score++;
    }
    if(score>top){top=score;best=v.id}
  }
  return best;
}

function parse(raw){
  return raw.split(/\r?\n/)
    .map(l=>l.replace(/^\s*(?:\d+[.)]|[-*•])\s*/,'').trim())
    .filter(Boolean)
    .map(t=>({t:t.slice(0,90), v:classify(t.includes(' - ') ? t.split(' - ').slice(1).join(' - ') : t)}));
}

/* ---------- State & rendering ---------- */
let songs = [];
const $ = id => document.getElementById(id);

function render(){
  $('board').hidden = !songs.length;
  const grid = $('grid'); grid.textContent = '';
  for(const v of VIBES){
    const items = songs.map((s,i)=>({s,i})).filter(x=>x.s.v===v.id);
    if(!items.length) continue;
    const tile = document.createElement('div');
    tile.className = 'tile'; tile.style.background = v.bg; tile.style.color = v.fg;
    tile.innerHTML = '<h2></h2><p class="n"></p><ul></ul>';
    tile.querySelector('h2').textContent = v.name;
    tile.querySelector('.n').textContent = items.length + (items.length===1?' song':' songs');
    const ul = tile.querySelector('ul');
    for(const {s,i} of items){
      const li = document.createElement('li');
      const span = document.createElement('span'); span.textContent = s.t;
      const sel = document.createElement('select'); sel.title = 'Move to another vibe'; sel.setAttribute('aria-label','Move "'+s.t+'" to another vibe');
      sel.add(new Option('Move…','')); 
      VIBES.filter(o=>o.id!==v.id).forEach(o=>sel.add(new Option(o.name,o.id)));
      sel.onchange = () => { if(sel.value){ songs[i].v = sel.value; render(); } };
      li.append(span, sel); ul.append(li);
    }
    grid.append(tile);
  }
}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1800); }

$('sort').onclick = () => {
  const parsed = parse($('songs').value);
  if(!parsed.length){ toast('Paste at least one song first'); return; }
  songs = parsed; render(); $('board').scrollIntoView({behavior:'smooth'});
};
$('sample').onclick = () => {
  $('songs').value = ['Blinding Lights','Someone Like You','Walking on Sunshine','Levitating','Midnight City','Sunday Morning','Break Stuff','Yesterday','Dancing Queen','Skinny Love','Thunderstruck','Ocean Eyes','Dreams','Back in Black','Lost in Japan','Summer of 69'].join('\n');
  $('sort').click();
};

/* ---------- Share link (state lives in the URL hash, no server) ---------- */
function encode(){
  const data = {n:$('title').value, s:songs.map(s=>[s.t,s.v])};
  return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}
function decode(h){
  try{
    const d = JSON.parse(decodeURIComponent(escape(atob(h))));
    $('title').value = d.n || 'My mood board';
    songs = d.s.filter(x=>byId[x[1]]).map(x=>({t:String(x[0]).slice(0,90), v:x[1]}));
    render();
  }catch(e){}
}
$('link').onclick = async () => {
  const url = location.origin + location.pathname + '#' + encode();
  try{ await navigator.clipboard.writeText(url); toast('Link copied'); }
  catch(e){ prompt('Copy this link:', url); }
};
if(location.hash.length>1) decode(location.hash.slice(1));

/* ---------- PNG export (plain canvas, no libraries) ---------- */
function fit(ctx, text, maxW){
  if(ctx.measureText(text).width <= maxW) return text;
  while(text.length>1 && ctx.measureText(text+'…').width > maxW) text = text.slice(0,-1);
  return text+'…';
}
$('png').onclick = async () => {
  await document.fonts.ready;
  const FONT = '"Bricolage Grotesque", system-ui, sans-serif';
  const W=1200, pad=48, gap=20, cols=3, tw=(W-pad*2-gap*(cols-1))/cols, MAX=10, LH=32;
  const groups = VIBES.map(v=>({v, items:songs.filter(s=>s.v===v.id)})).filter(g=>g.items.length);
  const hOf = g => 96 + Math.min(g.items.length,MAX)*LH + (g.items.length>MAX?LH:0) + 20;
  const rows = []; for(let i=0;i<groups.length;i+=cols) rows.push(groups.slice(i,i+cols));
  const rowH = rows.map(r=>Math.max(...r.map(hOf)));
  const H = pad + 90 + rowH.reduce((a,b)=>a+b+gap,0) + pad - gap + 24;
  const c = document.createElement('canvas'); c.width=W*2; c.height=H*2;
  const x = c.getContext('2d'); x.scale(2,2);
  x.fillStyle='#F2F3F8'; x.fillRect(0,0,W,H);
  x.fillStyle='#1A1B33'; x.font='800 44px '+FONT; x.textBaseline='alphabetic';
  x.fillText(fit(x,$('title').value||'My mood board',W-pad*2), pad, pad+44);
  let y = pad + 90;
  rows.forEach((r,ri)=>{
    r.forEach((g,ci)=>{
      const tx = pad + ci*(tw+gap), th = rowH[ri];
      x.fillStyle = g.v.bg; x.beginPath(); x.roundRect(tx,y,tw,th,20); x.fill();
      x.fillStyle = g.v.fg; x.font='800 34px '+FONT; x.fillText(g.v.name, tx+22, y+52);
      x.font='400 16px '+FONT; x.globalAlpha=.75;
      x.fillText(g.items.length+(g.items.length===1?' song':' songs'), tx+22, y+78); x.globalAlpha=1;
      x.font='400 19px '+FONT;
      g.items.slice(0,MAX).forEach((s,i)=>{
        const ly = y+96+i*LH;
        x.globalAlpha=.3; x.fillRect(tx+22,ly,tw-44,1); x.globalAlpha=1;
        x.fillText(fit(x,s.t,tw-44), tx+22, ly+23);
      });
      if(g.items.length>MAX){ x.globalAlpha=.75; x.fillText('+ '+(g.items.length-MAX)+' more', tx+22, y+96+MAX*LH+23); x.globalAlpha=1; }
    });
    y += rowH[ri]+gap;
  });
  c.toBlob(b=>{
    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download=($('title').value||'mood-board').replace(/[^\w-]+/g,'-').toLowerCase()+'.png'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });
};
</script>
</body>
</html>
